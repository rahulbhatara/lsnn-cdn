<svg width="530.4mm" height="530.4mm" viewBox="0 0 1000 1000" id="lsnn_hrd_logo" xml:space="preserve" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip Path for Geometric Globe Grid -->
    <clipPath id="globe-clip">
      <circle cx="500" cy="395" r="108" />
    </clipPath>

    <!-- Reusable Minimalist Human Figure Module -->
    <g id="hrd-figure">
      <!-- Head -->
      <circle cx="500" cy="175" r="35" fill="currentColor" />
      <!-- Shoulders, Arms & Chest Silhouette -->
      <path fill="currentColor" d="
        M 337.51,285.40
        A 196,196 0 0,1 662.49,285.40
        L 619.38,314.48
        A 144,144 0 0,0 539.69,256.58
        L 539.69,274.00
        L 460.31,274.00
        L 460.31,256.58
        A 144,144 0 0,0 380.62,314.48
        Z" />
      <!-- Inner Subtle Arm Accent Lines -->
      <path fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" d="M 393.21,317.41 A 132,132 0 0,1 450.55,272.61" />
      <path fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" d="M 549.45,272.61 A 132,132 0 0,1 606.79,317.41" />
    </g>
  </defs>

  <!-- Scaled Central Emblem Group (1.84x Ratio, Flush Top at y=0) -->
  <g id="emblem-group" transform="translate(500 469.2) scale(1.84) translate(-500 -395)">
    <!-- Central Network Globe -->
    <g id="network-globe">
      <g clip-path="url(#globe-clip)" fill="none" stroke-linecap="round">
        <!-- Gold Orbital Meridians -->
        <ellipse cx="500" cy="395" rx="50" ry="110" stroke="#dfb152" stroke-width="6" transform="rotate(-28 500 395)" />
        <ellipse cx="500" cy="395" rx="50" ry="110" stroke="#dfb152" stroke-width="6" transform="rotate(28 500 395)" />
        <ellipse cx="500" cy="395" rx="108" ry="46" stroke="#dfb152" stroke-width="6" transform="rotate(-12 500 395)" />
        <!-- Deep Navy Network Highlight Arc -->
        <path d="M 392,388 A 115,64 -14 0,1 606,364" stroke="#14253e" stroke-width="6.5" />
      </g>
      <!-- Globe Outer Ring -->
      <circle cx="500" cy="395" r="110" fill="none" stroke="#dfb152" stroke-width="7" />
    </g>

    <!-- Three Connected Figures (120-Degree Radial Symmetry) -->
    <g id="collaborative-figures">
      <!-- Top Figure (Gold) -->
      <use href="#hrd-figure" color="#dfb152" />
      <!-- Bottom-Right Figure (Deep Navy) -->
      <use href="#hrd-figure" color="#14253e" transform="rotate(120 500 395)" />
      <!-- Bottom-Left Figure (Deep Navy) -->
      <use href="#hrd-figure" color="#14253e" transform="rotate(240 500 395)" />
    </g>
  </g>

  <!-- Full-Width Division Typography (Flush Left x=0, Right x=1000, Bottom y=1000) -->
  <g id="typography-group" text-anchor="middle" font-family="&#39;Plus Jakarta Sans&#39;, &#39;Outfit&#39;, &#39;Inter&#39;, &#39;Montserrat&#39;, &#39;Segoe UI&#39;, sans-serif">
    <text x="500" y="918" fill="#dfb152" font-size="88" font-weight="800">HUMAN RESOURCE</text>
    <text x="500" y="999" fill="#14253e" font-size="56" font-weight="700">DEVELOPMENT</text>
  </g>
</svg>