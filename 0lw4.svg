    <radialGradient id="center-halo" cx="50%" cy="43%" r="48%">
      <stop offset="0%" stop-color="#8b14ff" stop-opacity="0.34">
        <animate attributeName="stop-opacity" values="0.28;0.42;0.28" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#7601ff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#080c17" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
