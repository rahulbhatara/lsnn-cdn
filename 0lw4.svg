      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style type="text/css">
      text {
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        user-select: none;
      }
      .outer-ring-group, .signal-wave, .ls-float-group {
        transform-origin: 129.75656px 155.31041px;
      }
      .outer-ring-group {
        animation: ringPulse 3.2s ease-in-out infinite;
      }
      @keyframes ringPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.022); opacity: 0.86; }
      }
      .signal-wave {
        animation: radarWave 3.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .signal-wave-delayed {
        animation-delay: 1.6s;
      }
      @keyframes radarWave {
        0% { transform: scale(0.76); opacity: 0; stroke-width: 6; }
        15% { opacity: 0.75; }
        100% { transform: scale(1.18); opacity: 0; stroke-width: 1.2; }
      }
      .ls-float-group {
        filter: drop-shadow(0px 8px 14px rgba(18, 26, 42, 0.6));
        animation: emblemFloat 3.6s ease-in-out infinite;
      }
      @keyframes emblemFloat {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-6px) scale(1.028); }
      }
      .banner-sheen {
        fill: url(#banner-sheen-grad);
        animation: bannerSheenLoop 6.5s ease-in-out infinite;
      }
      @keyframes bannerSheenLoop {
        0% { transform: translateX(-400px) skewX(-22deg); opacity: 0; }
        6% { opacity: 0.9; }
        42% { transform: translateX(2300px) skewX(-22deg); opacity: 0.9; }
        48%, 100% { transform: translateX(2300px) skewX(-22deg); opacity: 0; }
      }
      .lsnn-idle-shimmer {
        animation: lsnnTextGleam 6.5s ease-in-out infinite;
      }
      @keyframes lsnnTextGleam {
        0%, 14% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
        24%, 28% { filter: drop-shadow(0 0 12px rgba(255,255,255,0.75)) drop-shadow(0 0 24px rgba(180,76,255,0.55)); }
        38%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      }
      .wall-beam {
        animation: wallSweep 11s linear infinite;
      }
      @keyframes wallSweep {
        0% { transform: translateX(-380px) skewX(-24deg); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(1380px) skewX(-24deg); opacity: 0; }
      }
      .live-dot {
        animation: liveBlink 1.4s ease-in-out infinite;
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .orbit-ring-slow {
        transform-origin: 500px 275px;
        animation: spinSlow 46s linear infinite;
      }
      .orbit-ring-rev {
        transform-origin: 500px 275px;
        animation: spinRev 34s linear infinite;
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .ticker-scroll {
        animation: tickerMove 22s linear infinite;
      }
      @keyframes tickerMove {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1240px); }
      }
      .scanline-sweep {
        animation: scanY 8s linear infinite;
      }
      @keyframes scanY {
        0% { transform: translateY(50px); opacity: 0; }
        10% { opacity: 0.45; }
        90% { opacity: 0.45; }
        100% { transform: translateY(540px); opacity: 0; }
      }
    </style>
