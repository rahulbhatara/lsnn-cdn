<svg width="1000" height="613" viewBox="0 0 1000 613" id="svg_lsnn_news_mid" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <radialGradient id="studio-bg-radial" cx="50%" cy="46%" r="72%" fx="50%" fy="42%">
      <stop offset="0%" stop-color="#22194a">
        <animate attributeName="stop-color" values="#22194a;#2b1b5e;#1d1640;#22194a" dur="10s" repeatCount="indefinite" />
      </stop>
