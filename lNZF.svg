<svg viewBox="0 0 920 184" id="svg_breaking_news" style="width: 100%; max-width: 920px; height: auto; display: block; margin: 0; padding: 0; border: none;" xml:space="preserve" xmlns="http://www.w3.org/2000/svg">

  <defs id="defs_main">
    <!-- Gradasi Banner Ungu Utama -->
    <linearGradient id="banner-purple-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9e2eff" />
      <stop offset="55%" stop-color="#8b14ff" />
      <stop offset="100%" stop-color="#7900ff" />
    </linearGradient>

    <!-- Gradasi Lipatan Segitiga Kiri Atas (Huruf B) -->
    <linearGradient id="flap-left-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b44cff" />
      <stop offset="100%" stop-color="#7400ff" />
    </linearGradient>

    <!-- Gradasi Lipatan Segitiga Kanan Bawah (Huruf S) -->
    <linearGradient id="flap-right-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ae42ff" />
      <stop offset="100%" stop-color="#7400ff" />
    </linearGradient>

    <!-- Filter Drop Shadow untuk Logo Bulat -->
    <filter id="outer-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Filter Bayangan Lipatan Diagonal Kiri Atas -->
    <filter id="flap-shadow-left" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="3.5" dy="3.5" stdDeviation="3.5" flood-color="#1a0038" flood-opacity="0.75" />
    </filter>

    <!-- Filter Bayangan Lipatan Diagonal Kanan Bawah -->
    <filter id="flap-shadow-right" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-3.5" dy="-3.5" stdDeviation="3.5" flood-color="#1a0038" flood-opacity="0.75" />
    </filter>

    <!-- Clip Path Memotong Sudut Kiri Atas Huruf B & Kanan Bawah Huruf S -->
    <clipPath id="clip-breaking-news">
      <polygon points="290,26 920,26 920,58 892,58 848,102 848,120 230,120 230,70 246,70" />
    </clipPath>

    <!-- Definisi Gradasi & Clip dari Logo Bulat Asli -->
    <linearGradient id="purple-globe-gradient-tune" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7601ff" />
      <stop offset="100%" stop-color="#b73eff" />
    </linearGradient>

    <clipPath id="globe-bg-clip-tune">
      <circle cx="129.75656" cy="155.31041" r="172.58" />
    </clipPath>

    <clipPath id="globe-grid-clip-tune">
      <circle cx="129.75656" cy="155.31041" r="160.58" />
    </clipPath>
  </defs>

  <!-- ================= 1. BACKGROUND BANNER UNGU ================= -->
  <rect x="0" y="0" width="920" height="184" fill="url(#banner-purple-grad)" />

  <!-- ================= 2. TEKS "BREAKING NEWS" + EFEK LIPATAN ================= -->
  <g id="breaking-news-group">
    <g clip-path="url(#clip-breaking-news)">
      <g transform="translate(260.86, 32) scale(0.645934) skewX(-11.26)" fill="#fefefe" fill-rule="evenodd">
        <!-- B -->
        <path d="M 0,0 L 48,0 C 64,0 70,9 70,23 C 70,35 63,43 53,47 C 66,51 73,60 73,74 C 73,90 64,100 46,100 L 0,100 Z M 24,19 L 24,39 L 41,39 C 47,39 50,35 50,29 C 50,23 47,19 41,19 Z M 24,57 L 24,81 L 43,81 C 50,81 53,76 53,69 C 53,62 50,57 43,57 Z" />
        <!-- R -->
        <path transform="translate(82, 0)" d="M 0,0 L 46,0 C 63,0 71,10 71,27 C 71,41 64,50 52,54 L 73,100 L 47,100 L 29,58 L 24,58 L 24,100 L 0,100 Z M 24,20 L 24,40 L 42,40 C 48,40 51,36 51,30 C 51,24 48,20 42,20 Z" />
        <!-- E -->
        <path transform="translate(164, 0)" d="M 0,0 L 62,0 L 62,21 L 24,21 L 24,39 L 56,39 L 56,59 L 24,59 L 24,79 L 62,79 L 62,100 L 0,100 Z" />
        <!-- A -->
        <path transform="translate(234, 0)" d="M 27,0 L 51,0 L 78,100 L 53,100 L 48,80 L 30,80 L 25,100 L 0,100 Z M 39,25 L 33,60 L 45,60 Z" />
        <!-- K -->
        <path transform="translate(320, 0)" d="M 0,0 L 24,0 L 24,41 L 48,0 L 74,0 L 46,46 L 75,100 L 48,100 L 29,62 L 24,70 L 24,100 L 0,100 Z" />
        <!-- I -->
        <path transform="translate(402, 0)" d="M 0,0 L 26,0 L 26,100 L 0,100 Z" />
        <!-- N -->
        <path transform="translate(440, 0)" d="M 0,0 L 24,0 L 52,55 L 52,0 L 76,0 L 76,100 L 52,100 L 24,45 L 24,100 L 0,100 Z" />
        <!-- G -->
        <path transform="translate(528, 0)" d="M 74,29 L 51,33 C 48,24 43,20 36,20 C 26,20 22,29 22,50 C 22,71 26,80 37,80 C 46,80 51,74 52,63 L 38,63 L 38,45 L 75,45 L 75,100 L 57,100 L 55,89 C 49,97 41,102 31,102 C 11,102 0,84 0,50 C 0,16 12,-2 36,-2 C 56,-2 70,9 74,29 Z" />

        <!-- N -->
        <path transform="translate(638, 0)" d="M 0,0 L 24,0 L 52,55 L 52,0 L 76,0 L 76,100 L 52,100 L 24,45 L 24,100 L 0,100 Z" />
        <!-- E -->
        <path transform="translate(726, 0)" d="M 0,0 L 62,0 L 62,21 L 24,21 L 24,39 L 56,39 L 56,59 L 24,59 L 24,79 L 62,79 L 62,100 L 0,100 Z" />
        <!-- W -->
        <path transform="translate(798, 0)" d="M 0,0 L 23,0 L 32,64 L 42,0 L 56,0 L 66,64 L 75,0 L 98,0 L 81,100 L 58,100 L 49,42 L 40,100 L 17,100 Z" />
        <!-- S -->
        <path transform="translate(904, 0)" d="M 67,13 L 55,31 C 48,24 39,20 31,20 C 24,20 20,23 20,28 C 20,33 24,36 37,40 C 55,46 69,54 69,72 C 69,91 54,102 33,102 C 18,102 6,97 0,89 L 12,70 C 19,77 27,81 36,81 C 44,81 48,78 48,73 C 48,67 44,64 31,60 C 13,54 1,46 1,29 C 1,10 15,-2 35,-2 C 49,-2 60,3 67,13 Z" />
      </g>
    </g>

    <!-- Segitiga Lipatan Ungu Kiri Atas Huruf B + Bayangan -->
    <polygon points="246,26 290,26 246,70" fill="url(#flap-left-grad)" filter="url(#flap-shadow-left)" />

    <!-- Segitiga Lipatan Ungu Kanan Bawah Huruf S + Bayangan -->
    <polygon points="848,102 892,58 892,102" fill="url(#flap-right-grad)" filter="url(#flap-shadow-right)" />
  </g>

  <!-- ================= 3. GARIS PEMISAH & INFO ALAMAT + HOTLINE ================= -->
  <line x1="248" y1="118" x2="890" y2="118" stroke="#fefefe" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Alamat di Kiri -->
  <text x="248" y="151" fill="#fefefe" font-family="&#39;Segoe UI&#39;, &#39;Roboto&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.2">Lindsay Circus, Little Seoul</text>

  <!-- Hotline di Kanan (Warna Oranye) -->
  <text x="890" y="152" text-anchor="end" fill="#ff9e00" font-family="&#39;Segoe UI&#39;, &#39;Roboto&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="1">HOTLINE 1-2-3</text>

