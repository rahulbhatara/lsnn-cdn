        <line x1="129.75656" y1="-5.26959" x2="129.75656" y2="315.89041" />
        <ellipse cx="129.75656" cy="155.31041" rx="49.7798" ry="160.5800" />
        <ellipse cx="129.75656" cy="155.31041" rx="95.2239" ry="160.5800" />
        <ellipse cx="129.75656" cy="155.31041" rx="126.8582" ry="160.5800" />
        <ellipse cx="129.75656" cy="155.31041" rx="147.7336" ry="160.5800" />
      </g>
    </g>

